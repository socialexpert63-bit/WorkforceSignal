<style>

PAGES.twin=()=>{const o=getOut(S.outId);const rowH=88,H=Math.max(1,o.twins.length)*rowH+40;
const cols=[16,262,520,780],W=[196,206,206,200];
const mid=H/2;let svg=`<svg class="map" viewBox="0 0 1000 ${H}" role="img" aria-label="Relationship map from ${esc(o.name)} to HR Twins, signals and actions">`;
const cc={Hypothesis:'warn',Correlation:'cy',Verified:'em'};
o.twins.forEach((t,i)=>{const y=20+i*rowH+rowH/2-34;const my=y+34;
svg+=`<path class="flow" d="M${cols[0]+W[0]},${mid} C${cols[0]+W[0]+30},${mid} ${cols[1]-30},${my} ${cols[1]},${my}" style="stroke:var(--ind)"/><path class="flow" d="M${cols[1]+W[1]},${my} H${cols[2]}" style="stroke:var(--${cc[t.status]})"/><path class="flow" d="M${cols[2]+W[2]},${my} H${cols[3]}" style="stroke:var(--em)"/>`;
const sel=S.twinSel===t.id?'sel':'';
svg+=`<g class="nd ${sel}" data-a="twinNode" data-v="${t.id}" tabindex="0" role="button"><rect x="${cols[1]}" y="${y}" width="${W[1]}" height="68" rx="10" style="fill:var(--surface);stroke:var(--line);stroke-width:1.5"/><text x="${cols[1]+12}" y="${y+22}" style="font-size:12px;font-weight:650;fill:var(--fg)">${esc(t.name.length>26?t.name.slice(0,25)+'…':t.name)}</text><text x="${cols[1]+12}" y="${y+42}" style="font-size:15px;font-weight:700;fill:var(--em)">${t.cur}${t.u.length<4?t.u:''}</text><text x="${cols[1]+W[1]-12}" y="${y+42}" text-anchor="end" style="font-size:10.5px;font-weight:650;fill:var(--${cc[t.status]})">${t.status}</text><text x="${cols[1]+12}" y="${y+58}" class="axis">${t.cur>=t.prev?'▲':'▼'} ${Math.abs(t.cur-t.prev).toFixed(1)} vs ${t.prev}</text></g>
<g class="nd" data-a="twinNode" data-v="${t.id}" tabindex="0" role="button"><rect x="${cols[2]}" y="${y}" width="${W[2]}" height="68" rx="10" style="fill:var(--soft);stroke:var(--line);stroke-width:1.5"/><text x="${cols[2]+12}" y="${y+20}" class="axis" style="font-weight:650">SUPPORTING SIGNALS</text>${t.sig.slice(0,2).map((s,j)=>`<text x="${cols[2]+12}" y="${y+38+j*15}" style="font-size:11.5px;fill:var(--fg)">${esc(s.length>30?s.slice(0,29)+'…':s)}</text>`).join('')}</g>
<g class="nd" data-a="twinNode" data-v="${t.id}" tabindex="0" role="button"><rect x="${cols[3]}" y="${y}" width="${W[3]}" height="68" rx="10" style="fill:var(--emsoft);stroke:var(--line);stroke-width:1.5"/><text x="${cols[3]+12}" y="${y+20}" class="axis" style="font-weight:650">STRATEGIC ACTION</text><text x="${cols[3]+12}" y="${y+38}" style="font-size:11.5px;fill:var(--fg)">${esc(t.act.slice(0,28))}</text><text x="${cols[3]+12}" y="${y+53}" style="font-size:11.5px;fill:var(--fg)">${esc(t.act.slice(28,56))}</text></g>`});
svg+=`<g class="nd" data-a="outNode" data-v="${o.id}" tabindex="0" role="button"><rect x="${cols[0]}" y="${mid-44}" width="${W[0]}" height="88" rx="12" style="fill:var(--mid);stroke:var(--ind);stroke-width:2"/><text x="${cols[0]+14}" y="${mid-20}" style="font-size:10.5px;font-weight:650;fill:#9FB0FF">BUSINESS OUTCOME</text><text x="${cols[0]+14}" y="${mid+2}" style="font-size:14px;font-weight:700;fill:#fff">${esc(o.name)}</text><text x="${cols[0]+14}" y="${mid+26}" style="font-size:13px;fill:#C9D3E6">${o.cur}${o.u} → target ${o.target}${o.u}</text></g>`;
if(!o.twins.length)svg+=`<text x="500" y="${mid}" text-anchor="middle" class="axis">No HR Twins yet. Use Add HR Twin.</text>`;
svg+='</svg>';
return `<div class="head"><div><div class="eyebrow">Flagship module</div><h1>Every Business Metric Has an HR Twin.</h1><p>Select a business outcome. See the workforce metrics that may be related to it. Links are analytical hypotheses you can configure, not assumed causes.</p></div><button class="btn pri" data-a="addTwin">${ic('plus',15)} Add HR Twin</button></div>
<div class="row">${OUT.map(x=>`<button class="chip ${x.id===o.id?'on':''}" data-a="selOut" data-v="${x.id}">${esc(x.name)}</button>`).join('')}</div>
<div class="card"><div class="ch"><div><h2>Business Outcome → HR Twin → Supporting Workforce Signals → Strategic Action</h2><div class="sub">Select a node for the metric drawer. Line color shows evidence status.</div></div><div class="row">${stPill('Hypothesis')}${stPill('Correlation')}${stPill('Verified')}</div></div><div class="scroll">${svg}</div><p class="sub" style="margin-top:8px">${ic('info',13)} Synthetic data. A Correlation means two series move together in demo data. Only a Verified label, set by a named reviewer, indicates a reviewed finding, and none of these labels claims causation.</p></div>
<div class="card"><div class="ch"><h2>HR Twin library for ${esc(o.name)}</h2><span class="sub">Owner: ${esc(o.owner)} · Measured ${esc(o.period)}</span></div><div class="scroll"><table class="tbl"><thead><tr><th>HR Twin</th><th>Current</th><th>Previous</th><th>Status</th><th>Owner</th><th>Denominator</th></tr></thead><tbody>${o.twins.map(t=>`<tr class="click" data-a="twinNode" data-v="${t.id}"><td><b>${esc(t.name)}</b></td><td>${t.cur}${t.u}</td><td>${t.prev}${t.u}</td><td>${stPill(t.status)}</td><td>${esc(t.own)}</td><td class="sub">${esc(t.den)}</td></tr>`).join('')||'<tr><td colspan="6" class="sub">No HR Twins mapped yet.</td></tr>'}</tbody></table></div></div>`};
A.selOut=v=>{S.outId=v;S.twinSel=null;render()};

<div class="grid g2"><div class="card flat"><div class="eyebrow">Current</div><div style="font-size:24px;font-weight:700">${t.cur}${t.u}</div></div><div class="card flat"><div class="eyebrow">Previous</div><div style="font-size:24px;font-weight:700">${t.prev}${t.u}</div><div class="${d>=0?'up':'dn'}" style="font-weight:600">${d>=0?'▲':'▼'} ${Math.abs(d).toFixed(1)}</div></div></div>
${lineChart(QS,[{name:t.name,c:'em',data:twTrend(t)}],{h:170,d:1,label:'Trend'})}
<div class="list" style="font-size:12.5px"><div><b>Population / denominator:</b> ${esc(t.den)}</div><div><b>Data source:</b> ${esc(t.src)}</div></div>
<div class="grid g2"><label class="f">Evidence status<select data-in="twStatus" data-id="${t.id}">${['Hypothesis','Correlation','Verified'].map(s=>`<option ${s===t.status?'selected':''}>${s}</option>`).join('')}</select></label><label class="f">Measurement period<select data-in="twPeriod" data-id="${t.id}">${['Q3 2026','Monthly','Quarterly','Rolling 12 months'].map(s=>`<option ${s===t.period?'selected':''}>${s}</option>`).join('')}</select></label></div>

<label class="f">Observations<textarea rows="3" data-in="twNotes" data-id="${t.id}" placeholder="Add an observation">${esc(t.notes)}</textarea></label>
<div><div class="eyebrow">Supporting evidence</div><div class="list" style="margin:6px 0">${t.evidence.map(e=>`<div class="item">${esc(e)}</div>`).join('')||'<div class="sub">No attachments yet.</div>'}</div><div class="row"><input id="evin" placeholder="Reference or file name" style="flex:1"><button class="btn sm" data-a="addEv" data-v="${t.id}">Attach</button></div></div>
<div><div class="eyebrow">Change log</div><div class="tl" style="margin-top:8px;font-size:12.5px">${t.log.map(l=>`<div>${esc(l)}</div>`).join('')}</div></div>`}

const toggles=o=>Object.entries(o).map(([k,v])=>`<label class="sw"><input type="checkbox" data-in="tog" data-k="${esc(k)}" ${v?'checked':''}> ${k}</label>`).join('');
if(s===0)b=`<div class="grid g2"><label class="f">Company name<input data-in="adm" value="${esc(S.company)}" disabled></label><label class="f">Industry<input data-in="adm" value="Logistics (fictional)"></label><label class="f">Fiscal year start<select data-in="adm"><option>January</option><option>April</option></select></label><label class="f">Currency<select data-in="adm"><option>USD</option><option>EUR</option></select></label></div>`;
else if(s===1)b=`<div class="list">${['Commercial','Technology','Operations','Corporate'].map(x=>`<div class="item" style="justify-content:space-between"><b>${x}</b><span class="sub">${DEPTS.filter(d=>d.bu===x).map(d=>d.n).join(', ')}</span></div>`).join('')}</div>`;
else if(s===2)b=`<div class="scroll"><table class="tbl"><thead><tr><th>Department</th><th>Business unit</th><th>Headcount</th></tr></thead><tbody>${DEPTS.map(d=>`<tr><td>${d.n}</td><td>${d.bu}</td><td>${d.hc}</td></tr>`).join('')}</tbody></table></div>`;
else if(s===3)b=`<div class="scroll"><table class="tbl"><thead><tr><th>KPI</th><th>Target</th><th>Owner</th><th></th></tr></thead><tbody>${OUT.map(o=>`<tr><td>${o.name}</td><td>${o.target}${o.u}</td><td>${o.owner}</td><td><button class="btn sm" data-a="editOut" data-v="${o.id}">Edit</button></td></tr>`).join('')}</tbody></table></div><button class="btn pri" data-a="newOut" style="margin-top:10px">New KPI</button>`;
else if(s===4)b=`<div class="scroll"><table class="tbl"><thead><tr><th>HR Twin</th><th>Outcome</th><th>Status</th></tr></thead><tbody>${OUT.flatMap(o=>o.twins.map(t=>`<tr><td>${t.name}</td><td>${o.name}</td><td>${stPill(t.status)}</td></tr>`)).join('')}</tbody></table></div>`;
else if(s===5)b=`<div class="scroll"><table class="tbl"><thead><tr><th>User</th><th>Role</th><th></th></tr></thead><tbody>${USERS.map((u,i)=>`<tr><td>${u.n}</td><td>${u.r}</td><td><button class="btn sm danger" data-a="rmUser" data-v="${i}">Remove</button></td></tr>`).join('')}</tbody></table></div><button class="btn pri" data-a="invite" style="margin-top:10px">Invite user</button>`;
else if(s===6)b=`<div class="scroll"><table class="tbl"><thead><tr><th>Role</th>${PERM.map(p=>`<th>${p}</th>`).join('')}</tr></thead><tbody>${ROLES.map(r=>`<tr><td>${r}</td>${PERM.map((p,j)=>`<td><input type="checkbox" data-in="perm" data-r="${r}" data-j="${j}" ${PM[r][j]?'checked':''} ${r==='Administrator'?'disabled':''} aria-label="${r}: ${p}"></td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
else if(s===7)b=`<div class="grid g2"><label class="f">Default report period<select data-in="adm"><option>Quarterly</option><option>Monthly</option></select></label><label class="f">Minimum group size for reporting<input type="number" value="8" min="5" data-in="adm"></label></div>`;
else if(s===8)b=`<div class="list">${toggles(NOTIFS)}</div>`;
else if(s===9)b=`<div class="list"><label class="sw"><input type="checkbox" checked data-in="adm"> Show completion badges (not accredited certificates)</label><label class="f">Default program length<select data-in="adm"><option>4 weeks</option><option>6 weeks</option></select></label></div>`;
else if(s===10)b=`<div class="list">${['HRIS','Payroll','Survey platform','CRM','Learning system'].map(x=>`<div class="item" style="justify-content:space-between"><b>${x}</b><span class="pill p-gray">Not connected (demo)</span></div>`).join('')}<p class="sub">No live integrations exist in this prototype. Data is synthetic.</p></div>`;
else b=`<div class="list"><label class="sw"><input type="checkbox" checked data-in="adm"> Suppress groups below minimum size</label><label class="sw"><input type="checkbox" checked data-in="adm"> Disable individual-level views</label><label class="sw"><input type="checkbox" checked data-in="adm"> Require named reviewer before Verified status</label><p class="sub">These are demonstration settings. This prototype does not provide production-grade employee data security.</p><button class="btn danger" data-a="reset" style="width:fit-content">Reset demo data</button></div>`;
return `<div class="head"><div><h1>Settings & Administration</h1><p>Configure the demo workspace. Changes apply for this session only.</p></div></div><div class="grid g12"><div class="card" style="align-self:start"><div class="list" style="gap:2px">${ASEC.map((x,i)=>`<button class="btn" style="border:0;justify-content:flex-start;${s===i?'background:var(--soft);':''}" data-a="asec" data-v="${i}">${i+1}. ${x}</button>`).join('')}</div></div><div class="card"><div class="ch"><h2>${ASEC[s]}</h2></div>${b}</div></div>`};
A.asec=v=>{S.admSec=+v;render()};IN.adm=()=>toast('Setting saved (demo)');IN.tog=(v,el)=>{NOTIFS[el.dataset.k]=el.checked;toast('Preference saved')};IN.perm=(v,el)=>{PM[el.dataset.r][+el.dataset.j]=el.checked;toast('Permission updated')};
A.invite=()=>openModal({t:'Invite user',body:`<label class="f">Name<input name="n" required></label><label class="f">Role<select name="r">${ROLES.map(r=>`<option>${r}</option>`).join('')}</select></label>`,ok:'Send invitation',onOk:f=>{USERS.push({n:f.n+' (invited, demo)',r:f.r});toast('Invitation recorded. No email is sent in this demo.')}});
A.rmUser=v=>openModal({t:'Remove user?',body:`<p>Remove ${esc(USERS[+v].n)} from this workspace?</p>`,ok:'Remove',danger:true,onOk:()=>{USERS.splice(+v,1);toast('User removed')}});
A.reset=()=>openModal({t:'Reset demo data?',body:'<p>This reloads the page and restores the original demo data.</p>',ok:'Reset',danger:true,onOk:()=>{location.reload();return false}});
/* ===== boot ===== */
addEventListener('hashchange',route);
if(location.hash&&location.hash!=='#overview')S.welcome=true;
route();
</script>

</body></html>
